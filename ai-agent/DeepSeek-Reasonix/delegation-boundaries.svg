<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1140" font-family="Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <title>Reasonix 子 Agent 委派的五概念边界与所有权拓扑</title>
  <desc>这张图讲的是 Reasonix 子 Agent 委派的五个概念为什么必须分开。左侧虚线容器 ProfileExecSpec 里有五个成员框：TaskSpec、WorkerSpec、CapabilityGrant、ContextRequest、SchedulerPolicy，每个框列出自己的字段与生命周期长度。容器外有三类来源与一处去处：Skill store 只向 WorkerSpec 做单向投影，它的 routing 元数据被红叉挡在容器外；调用参数只能收窄 CapabilityGrant，不能扩权；子 Agent 对读侧工具永久隐藏，不允许读兄弟、枚举手足。右上是解析层 ResolveProfileDefinition，它是唯一的收窄点，也是拒绝用户专用 worker 的地方。下方三个守卫框对应 profile_boundary_test.go 的三组断言：冻结字段集、反向投影守卫、routing 元数据留在后面。读者该看出的是：字段住在哪个成员里由「谁决定它的取值」判定，而不是由调用点就近决定。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
  <style>
