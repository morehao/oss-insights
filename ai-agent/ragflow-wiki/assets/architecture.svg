<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>RAGFlow 系统分层与请求主链路</title>
  <desc>这张图把 RAGFlow 拆成自下而上的四层，并标出请求自上而下的处理方向。最上层是接入层，用户通过 Web 控制台、REST API 与 CLI、以及客户端 SDK 和即时通讯机器人进入系统。第二层是进程角色层，同一个服务程序可以按不同角色启动，分别承担管理、在线接口、文档摄取、数据源同步和解析推理。第三层是核心引擎层，负责文档摄取流水线、Agent 运行时、检索与重排、DeepDoc 文档解析以及 RAG 生成。最底层是各层共享的基础设施，包括文档检索引擎、关系数据库与缓存、以及消息、对象存储与列式库，所有数据最终都落在这里。同层模块是并列关系，层与层之间不表示逐一对应。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --fg: #172033;
      --muted: #5b6475;
      --line: #64748b;
      --neutral: #e2e8f0;
      --input: #bfdbfe;
      --process: #c7d2fe;
      --storage: #99f6e4;
      --external: #fde68a;
      --risk: #fecaca;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #e5e7eb;
        --muted: #a3adbd;
        --line: #94a3b8;
        --neutral: #334155;
        --input: #1d4ed8;
        --process: #4338ca;
        --storage: #0f766e;
        --external: #92400e;
        --risk: #991b1b;
      }
    }
    svg {
      background: var(--bg);
    }
    .title {
      font-size: 20px;
      font-weight: 650;
      fill: var(--fg);
    }
    .label {
      font-size: 14px;
      font-weight: 600;
      fill: var(--fg);
    }
    .node-sub {
      font-size: 12px;
      fill: var(--fg);
      opacity: 0.72;
    }
    .zone-label {
      font-size: 13px;
      font-weight: 600;
      fill: var(--muted);
    }
    .small {
      font-size: 12px;
      fill: var(--muted);
    }
    .node {
      stroke: var(--line);
      stroke-width: 1;
    }
    .input {
      fill: var(--input);
    }
    .process {
      fill: var(--process);
    }
    .storage {
      fill: var(--storage);
    }
    .edge {
      stroke: var(--line);
      stroke-width: 1.5;
      fill: none;
    }
    .edge-arrow {
      marker-end: url(#arrow);
    }
    .zone {
      fill: none;
      stroke: var(--line);
      stroke-width: 1;
      stroke-dasharray: 6 5;
    }
    .tint-input {
      fill: var(--input);
      fill-opacity: 0.14;
    }
    .tint-process {
      fill: var(--process);
      fill-opacity: 0.14;
    }
    .tint-storage {
      fill: var(--storage);
      fill-opacity: 0.14;
    }
  </style>

  <rect x="0" y="0" width="1200" height="690" fill="var(--bg)" />

  <text class="title" x="40" y="38">RAGFlow 系统分层与请求主链路</text>

  <!-- connectors：先画，再画 node 以覆盖 -->
  <line class="edge edge-arrow" x1="600" y1="152" x2="600" y2="184" />
  <line class="edge edge-arrow" x1="600" y1="280" x2="600" y2="312" />
  <line class="edge edge-arrow" x1="600" y1="416" x2="600" y2="448" />

  <!-- 分层区域（虚线 + 淡色底） -->
  <rect class="zone tint-input" x="40" y="64" width="1120" height="88" rx="10" />
  <text class="zone-label" x="60" y="86">接入层</text>

  <rect class="zone tint-process" x="40" y="184" width="1120" height="96" rx="10" />
  <text class="zone-label" x="60" y="206">进程角色层</text>

  <rect class="zone tint-process" x="40" y="312" width="1120" height="104" rx="10" />
  <text class="zone-label" x="60" y="334">核心引擎层</text>

  <rect class="zone tint-storage" x="40" y="448" width="1120" height="152" rx="10" />
  <text class="zone-label" x="60" y="470">基础设施层</text>

  <!-- 接入层 -->
  <rect class="node input" x="60" y="96" width="340" height="50" rx="10" />
  <text class="label" x="230" y="117" text-anchor="middle">Web 控制台</text>
  <text class="node-sub" x="230" y="134" text-anchor="middle">React + Vite</text>

  <rect class="node input" x="430" y="96" width="340" height="50" rx="10" />
  <text class="label" x="600" y="117" text-anchor="middle">REST API 与 CLI</text>
  <text class="node-sub" x="600" y="134" text-anchor="middle">HTTP 接口、命令行</text>

  <rect class="node input" x="800" y="96" width="340" height="50" rx="10" />
  <text class="label" x="970" y="117" text-anchor="middle">SDK 与机器人通道</text>
  <text class="node-sub" x="970" y="134" text-anchor="middle">客户端 SDK、即时通讯</text>

  <!-- 进程角色层 -->
  <rect class="node process" x="60" y="214" width="200" height="58" rx="10" />
  <text class="label" x="160" y="238" text-anchor="middle">Admin</text>
  <text class="node-sub" x="160" y="257" text-anchor="middle">管理进程</text>

  <rect class="node process" x="280" y="214" width="200" height="58" rx="10" />
  <text class="label" x="380" y="238" text-anchor="middle">API</text>
  <text class="node-sub" x="380" y="257" text-anchor="middle">在线接口</text>

  <rect class="node process" x="500" y="214" width="200" height="58" rx="10" />
  <text class="label" x="600" y="238" text-anchor="middle">Ingestor</text>
  <text class="node-sub" x="600" y="257" text-anchor="middle">文档摄取</text>

  <rect class="node process" x="720" y="214" width="200" height="58" rx="10" />
  <text class="label" x="820" y="238" text-anchor="middle">Syncer</text>
  <text class="node-sub" x="820" y="257" text-anchor="middle">数据源同步</text>

  <rect class="node process" x="940" y="214" width="200" height="58" rx="10" />
  <text class="label" x="1040" y="238" text-anchor="middle">DeepDoc</text>
  <text class="node-sub" x="1040" y="257" text-anchor="middle">解析推理</text>

  <!-- 核心引擎层 -->
  <rect class="node process" x="60" y="342" width="200" height="58" rx="10" />
  <text class="label" x="160" y="366" text-anchor="middle">文档摄取流水线</text>
  <text class="node-sub" x="160" y="385" text-anchor="middle">画布编排，分块入库</text>

  <rect class="node process" x="280" y="342" width="200" height="58" rx="10" />
  <text class="label" x="380" y="366" text-anchor="middle">Agent 运行时</text>
  <text class="node-sub" x="380" y="385" text-anchor="middle">工作流 · 组件 · 工具</text>

  <rect class="node process" x="500" y="342" width="200" height="58" rx="10" />
  <text class="label" x="600" y="366" text-anchor="middle">检索与重排</text>
  <text class="node-sub" x="600" y="385" text-anchor="middle">混合检索 + 重排</text>

  <rect class="node process" x="720" y="342" width="200" height="58" rx="10" />
  <text class="label" x="820" y="366" text-anchor="middle">DeepDoc 解析</text>
  <text class="node-sub" x="820" y="385" text-anchor="middle">版面、表格识别</text>

  <rect class="node process" x="940" y="342" width="200" height="58" rx="10" />
  <text class="label" x="1040" y="366" text-anchor="middle">RAG 生成</text>
  <text class="node-sub" x="1040" y="385" text-anchor="middle">提示与引用</text>

  <!-- 基础设施层 -->
  <rect class="node storage" x="60" y="482" width="340" height="86" rx="10" />
  <text class="label" x="230" y="520" text-anchor="middle">文档检索引擎</text>
  <text class="node-sub" x="230" y="540" text-anchor="middle">Elasticsearch / Infinity</text>

  <rect class="node storage" x="430" y="482" width="340" height="86" rx="10" />
  <text class="label" x="600" y="520" text-anchor="middle">关系数据库与缓存</text>
  <text class="node-sub" x="600" y="540" text-anchor="middle">MySQL、PostgreSQL、Kvrocks</text>

  <rect class="node storage" x="800" y="482" width="340" height="86" rx="10" />
  <text class="label" x="970" y="520" text-anchor="middle">消息、对象存储与列式库</text>
  <text class="node-sub" x="970" y="540" text-anchor="middle">NATS JetStream、MinIO、ClickHouse</text>

  <!-- 底部说明 -->
  <text class="small" x="40" y="636">自上而下是请求处理方向；同层内的模块并列，层与层之间不表示逐一对应。</text>
  <text class="small" x="40" y="656">最底层为各层共享的基础设施，也是全部数据落地的地方。</text>
</svg>
