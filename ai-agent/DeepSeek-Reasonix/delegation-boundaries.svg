  <text class="label" x="64" y="136">ProfileExecSpec</text>
  <text class="small" x="64" y="158">五个成员各管一段生命周期，调用方只往「决定取值」的成员塞字段</text>

  <text class="label" x="82" y="208">TaskSpec</text>
  <text class="small" x="82" y="230">Objective · Description</text>
  <text class="small" x="82" y="248">每次调用由委派方决定</text>
  <text class="small" x="82" y="266">不承载 worker 身份</text>

  <text class="label" x="82" y="330">WorkerSpec</text>
  <text class="small" x="82" y="352">Kind · Name · Profile · UseProfilePrompt</text>
  <text class="small" x="82" y="370">Model · Effort · SystemPrompt</text>
  <text class="small" x="82" y="388">ReviewReport · ReviewAuthority</text>

  <text class="label" x="82" y="452">CapabilityGrant</text>
  <text class="small" x="82" y="474">ReadOnly · AllowNoTools · CallTools</text>
  <text class="small" x="82" y="492">ProfileTools · WritePaths</text>
  <text class="small" x="82" y="510">整条运行的生命周期，只可收窄</text>

  <text class="label" x="82" y="574">ContextRequest</text>
  <text class="small" x="82" y="596">ContinueFrom · ForkFrom · Upstream</text>
  <text class="small" x="82" y="614">Ephemeral · TopLevel</text>
  <text class="small" x="82" y="632">开跑前一次决定，之后不再变</text>

  <text class="label" x="82" y="696">SchedulerPolicy</text>
  <text class="small" x="82" y="718">MaxSteps · RunInBackground · Nested</text>
  <text class="small" x="82" y="736">BackgroundWriter · Priority</text>
  <text class="small" x="82" y="754">OnStart · OnQueued</text>

  <text class="label" x="514" y="140">Skill store</text>
  <text class="small" x="514" y="166">frontmatter: ceiling / body / 裁决契约</text>
  <text class="small" x="514" y="188">routing 元数据：不进容器</text>

  <text class="label" x="904" y="140">ResolveProfileDefinition</text>
  <text class="small" x="904" y="166">runAs=subagent 才放行</text>
  <text class="small" x="904" y="188">用户专用 worker 返回错误</text>

  <text class="label" x="514" y="506">子 Agent 独立会话</text>
  <text class="small" x="514" y="532">同一道权限门 + 同一工作区根</text>
  <text class="small" x="514" y="554">递归工具按深度摘除</text>

  <text class="label" x="904" y="506">读侧工具</text>
  <text class="small" x="904" y="532">read_subagent_result</text>
  <text class="small" x="904" y="554">list_subagents / fleet</text>

  <text class="label" x="514" y="674">调用参数</text>
  <text class="small" x="514" y="700">只能收窄，不能扩权</text>
  <text class="small" x="514" y="720">tools / write_paths / max_steps</text>

  <text class="label" x="64" y="876">冻结字段集</text>
  <text class="small" x="64" y="902">profile_boundary_test.go</text>
  <text class="small" x="64" y="924">:49-70　逐成员白名单</text>

  <text class="label" x="334" y="876">反向守卫</text>
  <text class="small" x="334" y="902">profile_boundary_test.go</text>
  <text class="small" x="334" y="924">:96-122　投影不许丢字段</text>

  <text class="label" x="604" y="876">routing 元数据留在后面</text>
  <text class="small" x="604" y="902">profile_boundary_test.go</text>
  <text class="small" x="604" y="924">:72-92　决定何时挑 worker</text>

  <text class="band" x="64" y="1008">图例</text>
  <text class="small" x="64" y="1036">① Skill store（external）单向投影成 WorkerSpec；routing 元数据被挡在容器外</text>
  <text class="small" x="64" y="1058">② 调用参数只可收窄 CapabilityGrant；ceiling ∩ request</text>
  <text class="small" x="64" y="1080">③ 子 Agent 对读侧工具永久隐藏；不读兄弟、不枚举手足</text>
  <text class="small" x="620" y="1036">④ ResolveProfileDefinition 拒绝 runAs≠subagent 与用户专用 worker</text>
  <text class="small" x="620" y="1058">✕ 红叉＝被显式拒绝的边，不是漏画</text>
  <text class="small" x="620" y="1080">色：input 调用方 · process 执行 · neutral 归属 · storage 守卫 · risk 禁止面</text>

  <circle cx="472" cy="178" r="11" fill="#ffffff" stroke="#475569" stroke-width="1" />
  <text class="small" x="472" y="182" text-anchor="middle" style="fill:#0f172a">1</text>
  <circle cx="452" cy="672" r="11" fill="#ffffff" stroke="#475569" stroke-width="1" />
  <text class="small" x="452" y="676" text-anchor="middle" style="fill:#0f172a">2</text>
  <circle cx="852" cy="506" r="11" fill="#ffffff" stroke="#475569" stroke-width="1" />
  <text class="small" x="852" y="510" text-anchor="middle" style="fill:#0f172a">3</text>
  <circle cx="852" cy="145" r="11" fill="#ffffff" stroke="#475569" stroke-width="1" />
  <text class="small" x="852" y="149" text-anchor="middle" style="fill:#0f172a">4</text>

  <text class="small" x="516" y="296" style="fill:#dc2626">routing 元数据被挡在容器外</text>
  <text class="small" x="904" y="290">解析层是唯一的收窄点：</text>
  <text class="small" x="904" y="312">拒绝 runAs≠subagent 的名字，也拒绝</text>
  <text class="small" x="904" y="334">DisableModelInvocation 的用户专用 worker</text>
</svg>
