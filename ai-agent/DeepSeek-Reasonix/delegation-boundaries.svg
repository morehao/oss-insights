      --neutral: #e2e8f0;
      --input: #bfdbfe;
      --process: #c7d2fe;
      --storage: #99f6e4;
      --external: #fde68a;
      --risk: #fecaca;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #e5e7eb;
        --muted: #a3adbd;
        --line: #94a3b8;
        --neutral: #334155;
        --input: #1d4ed8;
        --process: #4338ca;
        --storage: #0f766e;
        --external: #92400e;
        --risk: #991b1b;
      }
    }
    svg {
      background: var(--bg);
    }
    .title {
      font-size: 20px;
      font-weight: 650;
      fill: var(--fg);
    }
    .label {
      font-size: 14px;
      font-weight: 600;
      fill: var(--fg);
    }
    .small {
      font-size: 12px;
      fill: var(--muted);
    }
    .band {
      font-size: 12px;
      font-weight: 600;
      fill: var(--muted);
    }
    .node {
      stroke: var(--line);
      stroke-width: 1;
    }
    .neutral {
      fill: var(--neutral);
    }
    .input {
      fill: var(--input);
    }
    .process {
      fill: var(--process);
    }
    .storage {
      fill: var(--storage);
    }
    .external {
      fill: var(--external);
    }
    .risk {
      fill: var(--risk);
    }
    .edge {
      stroke: var(--line);
      stroke-width: 1.5;
      fill: none;
    }
    .edge-arrow {
      marker-end: url(#arrow);
    }
    .edge-dashed {
      stroke-dasharray: 6 5;
    }
    .zone {
      fill: none;
      stroke: var(--line);
      stroke-width: 1;
      stroke-dasharray: 6 5;
      opacity: 0.8;
    }
  </style>

  <rect x="0" y="0" width="1240" height="1140" fill="var(--bg)" />

  <text class="title" x="40" y="44">图 2　子 Agent 委派的五概念边界与所有权拓扑</text>
  <text class="small" x="40" y="72">容器内的五个成员各管一段生命周期；容器外的来源与去处各有一条被拒绝的边</text>

  <path class="edge edge-arrow" d="M 490 200 L 452 200 L 452 358 L 422 358" />
  <path class="edge edge-arrow" d="M 490 695 L 470 695 L 470 480 L 422 480" />
  <path class="edge edge-arrow" d="M 820 530 L 880 530" />
  <path class="edge edge-arrow" d="M 820 169 L 880 169" />
  <path class="edge edge-arrow" d="M 170 840 L 170 800" />
  <path class="edge edge-arrow" d="M 430 840 L 430 800" />
  <path class="edge edge-arrow" d="M 710 840 L 710 780 L 440 780" />

  <path class="forbidden" d="M 552 234 L 500 300" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5" />
  <path class="forbidden" d="M 490 290 L 510 310" fill="none" stroke="#dc2626" stroke-width="2" />
  <path class="forbidden" d="M 510 290 L 490 310" fill="none" stroke="#dc2626" stroke-width="2" />

  <rect class="node zone" x="40" y="104" width="400" height="696" rx="10" />
