<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780">
  <title>摄取任务状态机</title>
  <desc>摄取任务的状态迁移图：待调度、已调度、运行中、已完成、已失败、已停止六个状态，以及从已失败回到待调度的重试回边（带退避）。每个迁移都会持久化写入数据库。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/>
    </marker>
  </defs>
  <style>
:root {
  color-scheme: light dark;
  --bg: #f8fafc; --fg: #172033; --muted: #5b6475; --line: #64748b;
  --neutral: #e2e8f0; --input: #bfdbfe; --process: #c7d2fe;
  --storage: #99f6e4; --external: #fde68a; --risk: #fecaca;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a; --fg: #e5e7eb; --muted: #a3adbd; --line: #94a3b8;
    --neutral: #334155; --input: #1d4ed8; --process: #4338ca;
    --storage: #0f766e; --external: #92400e; --risk: #991b1b;
  }
}
svg { background: var(--bg); }
.title { font-size: 20px; font-weight: 650; fill: var(--fg); }
.label { font-size: 14px; font-weight: 600; fill: var(--fg); }
.small { font-size: 12px; fill: var(--muted); }
.mono { font-size: 11.5px; fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.node { stroke: var(--line); stroke-width: 1; }
.neutral { fill: var(--neutral); }
.input { fill: var(--input); }
.process { fill: var(--process); }
.storage { fill: var(--storage); }
.external { fill: var(--external); }
.risk { fill: var(--risk); }
.edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
.edge-dashed { stroke: var(--line); stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; }
.edge-arrow { marker-end: url(#arrow); }
.zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.8; }
  </style>
  <rect x="0" y="0" width="1280" height="780" fill="var(--bg)"/>

  <!-- 1. zones -->
  <rect class="zone" x="40" y="120" width="1210" height="500" rx="10"/>
  <text class="small" x="56" y="112">状态迁移区：主干单向向前，失败回流重试</text>

  <!-- 2. connectors -->
  <path class="edge edge-arrow" d="M 79 210 H 140"/>
  <path class="edge edge-arrow" d="M 310 210 H 410"/>
  <path class="edge edge-arrow" d="M 580 210 H 680"/>
  <path class="edge edge-arrow" d="M 850 210 H 950"/>
  <path class="edge edge-arrow" d="M 1120 210 H 1197"/>
  <path class="edge edge-arrow" d="M 765 254 V 376"/>
  <path class="edge edge-arrow" d="M 830 254 V 330 H 1035 V 376"/>
  <path class="edge edge-arrow" d="M 1035 464 V 532"/>
  <path class="edge edge-arrow" d="M 765 464 V 580 H 225 V 254"/>

  <!-- 3. nodes -->
  <circle cx="70" cy="210" r="9" class="node neutral" stroke="var(--line)" stroke-width="1.5"/>
  <rect class="node process" x="140" y="166" width="170" height="88" rx="8"/>
  <rect class="node process" x="410" y="166" width="170" height="88" rx="8"/>
  <rect class="node process" x="680" y="166" width="170" height="88" rx="8"/>
  <rect class="node process" x="950" y="166" width="170" height="88" rx="8"/>
  <circle cx="1210" cy="210" r="13" class="node neutral" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="1210" cy="210" r="7" class="node neutral" stroke="var(--line)" stroke-width="1.5"/>
  <rect class="node risk" x="680" y="376" width="170" height="88" rx="8"/>
  <rect class="node neutral" x="950" y="376" width="170" height="88" rx="8"/>
  <circle cx="1035" cy="545" r="13" class="node neutral" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="1035" cy="545" r="7" class="node neutral" stroke="var(--line)" stroke-width="1.5"/>
  <rect class="node neutral" x="60" y="640" width="460" height="90" rx="8"/>

  <!-- 4. titles / labels -->
  <text class="title" x="40" y="44">图 6 · 摄取任务状态机</text>
  <text class="small" x="40" y="68">状态真源在数据库，消息只是唤醒信号；失败回流不新建任务</text>

  <text class="label" x="225" y="202" text-anchor="middle">待调度</text>
  <text class="small" x="225" y="226" text-anchor="middle">任务已入库</text>
  <text class="label" x="495" y="202" text-anchor="middle">已调度</text>
  <text class="small" x="495" y="226" text-anchor="middle">消息已发布</text>
  <text class="label" x="765" y="202" text-anchor="middle">运行中</text>
  <text class="small" x="765" y="226" text-anchor="middle">持有租约</text>
  <text class="label" x="1035" y="202" text-anchor="middle">已完成</text>
  <text class="small" x="1035" y="226" text-anchor="middle">终态</text>
  <text class="label" x="765" y="412" text-anchor="middle">已失败</text>
  <text class="small" x="765" y="436" text-anchor="middle">保留重试计数</text>
  <text class="label" x="1035" y="412" text-anchor="middle">已停止</text>
  <text class="small" x="1035" y="436" text-anchor="middle">终态</text>

  <text class="small" x="109" y="200" text-anchor="middle">任务创建</text>
  <text class="small" x="360" y="200" text-anchor="middle">发布消息成功</text>
  <text class="small" x="630" y="200" text-anchor="middle">worker 领取</text>
  <text class="small" x="900" y="200" text-anchor="middle">管线成功</text>
  <text class="small" x="778" y="340">管线异常</text>
  <text class="small" x="900" y="352" text-anchor="middle">主动停止</text>
  <text class="small" x="495" y="572" text-anchor="middle">重试（带退避）</text>
  <text class="small" x="70" y="186" text-anchor="middle">起点</text>
  <text class="small" x="1210" y="186" text-anchor="middle">终态</text>
  <text class="small" x="1035" y="580" text-anchor="middle">终态</text>

  <text class="label" x="84" y="676">每个状态迁移都会持久化写入</text>
  <text class="small" x="84" y="700">状态真源在数据库；重试共享同一条运行历史</text>
</svg>
