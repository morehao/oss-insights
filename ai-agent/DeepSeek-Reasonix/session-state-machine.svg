<svg viewBox="0 0 1360 1130" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif">
  <title>会话状态机：三条泳道、四类边，以及两个双圈终点</title>
  <desc>这张图是 Reasonix 会话状态机的全景。三条横向泳道分别是会话生命周期（S0–S4）、轮次与变更（T0–T6）与 rewind 事务（R0–R8），每个状态只用编号加中文短名标注。四种线型承载全部语义：灰细实线是正向推进；暖色粗曲线是可反复走的回边，含 R3→T1 的 rewind、R2→R6→R5 的崩溃恢复与 R6 的自环重试；红虚线是只能走一次或跨进程的边，即 R4→R3 的 undo 与 T2→T5 的写者冲突；灰粗实线指向的双圈盒是终点，S4 是拒绝而非降级，R7 是载荷已过期、元数据仍在。回边因此分成可以再走一次与只有一次两类，两条不可逆边都没有返回箭头。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --fg: #172033;
      --muted: #5b6475;
      --line: #64748b;
      --neutral: #e2e8f0;
      --input: #bfdbfe;
      --process: #c7d2fe;
      --storage: #99f6e4;
      --external: #fde68a;
      --risk: #fecaca;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #e5e7eb;
        --muted: #a3adbd;
        --line: #94a3b8;
        --neutral: #334155;
        --input: #1d4ed8;
        --process: #4338ca;
        --storage: #0f766e;
        --external: #92400e;
        --risk: #991b1b;
      }
    }
    svg {
      background: var(--bg);
    }
    .title {
      font-size: 20px;
      font-weight: 650;
      fill: var(--fg);
    }
    .label {
      font-size: 14px;
      font-weight: 600;
      fill: var(--fg);
    }
    .small {
      font-size: 12px;
      fill: var(--muted);
    }
    .band {
      font-size: 12px;
      font-weight: 600;
      fill: var(--muted);
    }
    .node {
      stroke: var(--line);
      stroke-width: 1;
    }
    .neutral {
      fill: var(--neutral);
    }
    .input {
      fill: var(--input);
    }
    .process {
      fill: var(--process);
    }
    .storage {
      fill: var(--storage);
    }
    .external {
      fill: var(--external);
    }
    .risk {
      fill: var(--risk);
    }
    .edge {
      stroke: var(--line);
      stroke-width: 1.5;
      fill: none;
    }
    .edge-arrow {
      marker-end: url(#arrow);
    }
    .edge-dashed {
      stroke-dasharray: 6 5;
    }
    .zone {
      fill: none;
      stroke: var(--line);
      stroke-width: 1;
      stroke-dasharray: 6 5;
      opacity: 0.8;
    }
    .warm {
      fill: #c2410c;
    }
    .hard {
      fill: #b91c1c;
    }
  </style>
  <defs>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c" />
    </marker>
    <marker id="arrow-oneshot" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1360" height="1130" fill="var(--bg)" />

  <rect x="40" y="110" width="300" height="830" rx="10" fill="var(--neutral)" opacity="0.35" />
  <rect x="400" y="110" width="300" height="830" rx="10" fill="var(--neutral)" opacity="0.35" />
  <rect x="740" y="110" width="360" height="830" rx="10" fill="var(--neutral)" opacity="0.35" />
  <rect x="40" y="960" width="1280" height="140" rx="10" fill="var(--neutral)" opacity="0.25" />

  <text class="title" x="40" y="44">会话状态机：一条正向主线、两类回边与两条不可逆边</text>
  <text class="small" x="40" y="70">DeepSeek-Reasonix v2.37.0 · 21 个状态 + 1 个派生产物 · 回边分"可反复走"与"只能走一次"两类</text>
  <text class="band" x="56" y="134">泳道一 · 会话生命周期</text>
  <text class="band" x="416" y="134">泳道二 · 轮次与变更</text>
  <text class="band" x="756" y="134">泳道三 · rewind 事务</text>

  <path class="edge edge-arrow" d="M 90 234 L 54 234 L 54 422 L 68 422" />
  <path class="edge edge-arrow" d="M 290 234 L 324 234 L 324 532 L 308 532" />
  <path class="edge edge-arrow" d="M 180 500 L 180 454" />
  <path class="edge edge-arrow" d="M 220 390 L 220 344" />
